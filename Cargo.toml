[package]
name = "hyperminhash"
version = "0.2.5"
authors = ["Lukas Lueg <lukas.lueg@gmail.com>"]
repository = "https://github.com/lukaslueg/hyperminhash"
documentation = "https://docs.rs/hyperminhash"
description = "Fast, constant-memory cardinality approximation"
edition = "2024"
rust-version = "1.87"
readme = "README.md"
license = "MIT"
exclude = [ "examples/drift.png" ]

[dependencies]
xxhash-rust = { version = "0.8", features = [ "std", "xxh3" ] }
serde = { version = "1", optional = true }

[dev-dependencies]
rand = "0.10"
crossbeam = "0.8"
memchr = "2"
criterion = "0.8"
walkdir = "2"
serde_json = "1"
bincode = "1.3"

[features]
default = []
# Same feature name as 0.1.x; also enables Serde support in 0.2.x.
serialize = ["dep:serde"]


[[bench]]
name = "benches"
harness = false
